<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Simon Says – GameZone</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f1a;color:#e0e0ff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
.back{position:fixed;top:1rem;left:1rem;color:#6c63ff;text-decoration:none;font-size:.9rem;z-index:10;background:rgba(15,15,26,.8);padding:.3rem .7rem;border-radius:8px;border:1px solid rgba(108,99,255,.3)}
.back:hover{color:#fff}
h1{font-size:1.8rem;background:linear-gradient(135deg,#6c63ff,#ff6584);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem}
#hud{display:flex;gap:2rem;margin-bottom:.8rem;font-size:1rem;color:#8888aa}
#hud strong{color:#e0e0ff;font-size:1.2rem}
#simon-wrap{position:relative;width:min(80vw,300px);height:min(80vw,300px)}
.pad{position:absolute;border:4px solid #0f0f1a;cursor:pointer;transition:filter .1s,transform .1s;user-select:none;-webkit-user-select:none}
.pad.flash{filter:brightness(2.5) saturate(1.5)!important;transform:scale(1.04)}
#pad-0{top:0;left:0;width:50%;height:50%;background:#e74c3c;border-radius:100% 0 0 0}
#pad-1{top:0;right:0;width:50%;height:50%;background:#2ecc71;border-radius:0 100% 0 0}
#pad-2{bottom:0;left:0;width:50%;height:50%;background:#3498db;border-radius:0 0 0 100%}
#pad-3{bottom:0;right:0;width:50%;height:50%;background:#f1c40f;border-radius:0 0 100% 0}
#pad-0.active{background:#e74c3c}
#pad-1.active{background:#2ecc71}
#pad-2.active{background:#3498db}
#pad-3.active{background:#f1c40f}
#center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28%;height:28%;background:#0f0f1a;border-radius:50%;z-index:2;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#8888aa;font-weight:700;text-align:center;pointer-events:none}
#status{margin:.8rem 0 .4rem;font-size:1rem;color:#8888aa;min-height:1.4em;text-align:center}
.btn{background:#6c63ff;color:#fff;border:none;padding:.65rem 1.8rem;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:.5rem;transition:opacity .2s}
.btn:hover{opacity:.85}
#overlay{position:fixed;inset:0;background:rgba(15,15,26,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;z-index:20}
#overlay h2{font-size:2rem;color:#6c63ff}
#overlay p{color:#8888aa;text-align:center;max-width:300px;line-height:1.5}
</style>
</head>
<body>
<a class="back" href="../../index.html">← Back</a>
<h1>🟢 Simon Says</h1>
<div id="hud">
  <div><span>Round </span><strong id="round">0</strong></div>
  <div><span>Best </span><strong id="best">0</strong></div>
</div>
<div id="simon-wrap">
  <div class="pad" id="pad-0"></div>
  <div class="pad" id="pad-1"></div>
  <div class="pad" id="pad-2"></div>
  <div class="pad" id="pad-3"></div>
  <div id="center">SIMON</div>
</div>
<div id="status">Watch and repeat the sequence!</div>
<button class="btn" id="start-btn">Start</button>

<div id="overlay">
  <h2>🟢 Simon Says</h2>
  <p>Watch the flashing sequence, then repeat it in the same order.<br>Each round adds one more step!</p>
  <p id="best-p" style="color:#ffbd2e;font-weight:700"></p>
  <button class="btn" id="ov-start">Start Game</button>
</div>

<script>
const pads = [0,1,2,3].map(i=>document.getElementById('pad-'+i));
const roundEl = document.getElementById('round');
const bestEl = document.getElementById('best');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start-btn');
const overlay = document.getElementById('overlay');
const ovStart = document.getElementById('ov-start');
const bestP = document.getElementById('best-p');

let best = parseInt(localStorage.getItem('simon_best')||'0');
bestEl.textContent = best;
bestP.textContent = best>0?`Best: ${best}`:'';

const COLORS = ['#e74c3c','#2ecc71','#3498db','#f1c40f'];
const FREQS = [261.6, 329.6, 392.0, 523.3]; // C4 E4 G4 C5

let sequence=[], playerSeq=[], round=0, accepting=false;
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();

function beep(idx, dur=0.3) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = FREQS[idx];
  o.type = 'sine';
  g.gain.setValueAtTime(0.4, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
  o.start(); o.stop(audioCtx.currentTime+dur);
}

function flashPad(idx) {
  return new Promise(res=>{
    pads[idx].classList.add('flash');
    beep(idx, 0.35);
    setTimeout(()=>{ pads[idx].classList.remove('flash'); setTimeout(res,80); }, 380);
  });
}

async function playSequence() {
  accepting = false;
  statusEl.textContent = 'Watch carefully…';
  await delay(600);
  for (const idx of sequence) { await flashPad(idx); await delay(150); }
  accepting = true;
  playerSeq = [];
  statusEl.textContent = `Your turn! (${sequence.length} step${sequence.length>1?'s':''})`;
}

function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function startGame() {
  overlay.style.display='none';
  sequence=[]; round=0; startBtn.textContent='Restart';
  await delay(400);
  nextRound();
}

async function nextRound() {
  round++;
  sequence.push(Math.floor(Math.random()*4));
  roundEl.textContent=round;
  await playSequence();
}

pads.forEach((pad,idx)=>{
  async function hit(e){ e.preventDefault();
    if (!accepting) return;
    pad.classList.add('flash'); beep(idx,0.2);
    setTimeout(()=>pad.classList.remove('flash'),200);
    playerSeq.push(idx);
    const pos = playerSeq.length-1;
    if (playerSeq[pos]!==sequence[pos]) {
      accepting=false;
      await delay(300);
      statusEl.textContent='❌ Wrong! Game over.';
      if (round-1>best){best=round-1;bestEl.textContent=best;localStorage.setItem('simon_best',best);}
      bestP.textContent=`Best: ${best}`;
      const oh2=overlay.querySelector('h2');oh2.textContent=`Round ${round}`;
      overlay.querySelector('p').textContent=`You got to round ${round} before making a mistake!`;
      overlay.style.display='flex';
      return;
    }
    if (playerSeq.length===sequence.length) {
      accepting=false;
      statusEl.textContent='✅ Correct! Next round…';
      if (round>best){best=round;bestEl.textContent=best;localStorage.setItem('simon_best',best);}
      await delay(800);
      nextRound();
    }
  }
  pad.addEventListener('click', hit);
  pad.addEventListener('touchstart', hit, {passive:false});
});

startBtn.addEventListener('click', startGame);
ovStart.addEventListener('click', startGame);
</script>
</body>
</html>
